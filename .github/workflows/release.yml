name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to build
        required: true
        default: v3.6.0

permissions:
  contents: write

jobs:
  build-tauri:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            platform: macos-latest
            rustTargets: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles dmg
          - label: macOS Intel
            platform: macos-latest
            rustTargets: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles dmg
          - label: Linux
            platform: ubuntu-22.04
            rustTargets: ""
            args: --bundles appimage,deb
          - label: Windows x64
            platform: windows-latest
            rustTargets: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles nsis

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTargets }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libwebkit2gtk-4.1-dev libappindicator3-dev libleptonica-dev librsvg2-dev libtesseract-dev patchelf xdg-utils

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps

      - name: Read application version
        id: app_version
        shell: bash
        run: echo "version=$(node -p \"require('./package.json').version\")" >> "$GITHUB_OUTPUT"

      - name: Build and upload Tauri bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          releaseName: CopyShare ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          releaseBody: |
            CopyShare desktop release.

            Assets include:
            - Windows x64 NSIS installer
            - macOS Apple Silicon
            - macOS Intel
            - Linux AppImage
            - Linux deb

            Download links:
            - [Windows x64](https://github.com/${{ github.repository }}/releases/download/${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}/CopyShare_${{ steps.app_version.outputs.version }}_x64-setup.exe)
            - [macOS Apple Silicon](https://github.com/${{ github.repository }}/releases/download/${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}/CopyShare_${{ steps.app_version.outputs.version }}_aarch64.dmg)
            - [macOS Intel](https://github.com/${{ github.repository }}/releases/download/${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}/CopyShare_${{ steps.app_version.outputs.version }}_x64.dmg)
            - [Linux AppImage](https://github.com/${{ github.repository }}/releases/download/${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}/CopyShare_${{ steps.app_version.outputs.version }}_amd64.AppImage)
            - [Linux deb](https://github.com/${{ github.repository }}/releases/download/${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}/CopyShare_${{ steps.app_version.outputs.version }}_amd64.deb)
          releaseDraft: true
          prerelease: false
          retryAttempts: 2
          uploadWorkflowArtifacts: false
          args: ${{ matrix.args }}
